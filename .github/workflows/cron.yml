name: Daily News Debrief Cron

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write # <-- Required to allow pushing news.json back to the repo

jobs:
  run-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run cron script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run cron

      - name: Commit and push updated news.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update daily news debrief [skip ci]"
          file_pattern: data/news.json
